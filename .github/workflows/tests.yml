name: tests

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26', '1.27']

    name: Go ${{ matrix.go }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Checkout laranex/go-myanmar-payments
        env:
          LARANEX_PACKAGES_TOKEN: ${{ secrets.LARANEX_PACKAGES_TOKEN }}
        run: |
          if [ -z "$LARANEX_PACKAGES_TOKEN" ]; then
            echo "::error title=Missing LARANEX_PACKAGES_TOKEN::laranex/go-myanmar-payments is private and v4.0.0 is not tagged yet. Add a LARANEX_PACKAGES_TOKEN secret with read access to it (see .github/CONTRIBUTING.md); forked pull requests do not receive secrets."
            exit 1
          fi
          repo="https://x-access-token:${LARANEX_PACKAGES_TOKEN}@github.com/laranex/go-myanmar-payments.git"
          git clone --depth 1 --branch dev "$repo" ../go-myanmar-payments \
            || git clone --depth 1 --branch main "$repo" ../go-myanmar-payments
          # Build against the checkout; this go.mod change is never committed.
          go mod edit -replace github.com/laranex/go-myanmar-payments/v4=../go-myanmar-payments

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
